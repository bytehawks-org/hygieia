# Dependency policy checked by `cargo deny check licenses bans sources` (workflow: audit).
# Vulnerabilities are checked separately by `cargo audit`.
[graph]
all-features = true

[licenses]
# Permissive licences only: the project itself is Apache-2.0 and must be able to ship in any form.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "OpenSSL",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
