[package]
name = "hygeia-store"
description = "Persistence traits and in-memory implementation (SQL migrations in migrations/)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hygeia-core.workspace = true
serde.workspace = true
thiserror.workspace = true
sha2.workspace = true
getrandom = "0.3"
base64 = "0.22"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
hygeia-audit.workspace = true
tracing.workspace = true
async-trait = "0.1"
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
