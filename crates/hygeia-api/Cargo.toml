[package]
name = "hygeia-api"
description = "Control plane: REST API, enrollment, bundle distribution"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hygeia-core.workspace = true
hygeia-audit.workspace = true
hygeia-store.workspace = true
serde.workspace = true
serde_json.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
axum = "0.8"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
thiserror.workspace = true

[dev-dependencies]
base64 = "0.22"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
ed25519-dalek.workspace = true
