[package]
name = "hygeia-proxy"
description = "Hygieia node: installable standalone server / endpoint connector (extension feed, local admin UI, opt-in local DNS)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "hygeia_proxy"
path = "src/lib.rs"

[[bin]]
name = "hygeia-proxy"
path = "src/main.rs"

[dependencies]
hygeia-core.workspace = true
hygeia-api.workspace = true
hygeia-store.workspace = true
hygeia-lists.workspace = true
hygeia-runtime.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum = "0.8"
toml = "0.9"
clap = { version = "4", features = ["derive"] }
ed25519-dalek.workspace = true
sha2.workspace = true
serde_json.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
hygeia-winsvc = { path = "../hygeia-winsvc" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
getrandom = "0.3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
