name: coverage
# Line coverage of the Rust workspace (no PostgreSQL: the PG suites are skipped here and run in `ci`).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  llvm-cov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: llvm-tools-preview }
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-llvm-cov }
      - run: cargo llvm-cov --workspace --summary-only | tee coverage.txt
      - run: cargo llvm-cov report --lcov --output-path lcov.info
      - run: |
          { echo '### Coverage (lines)'; echo '```'; tail -n 30 coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            lcov.info
            coverage.txt
